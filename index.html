
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WinGo Statistics Analyzer</title>
  <style>
    body {
      background: #101522;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .card {
      background: #202b40;
      padding: 20px;
      border-radius: 14px;
      margin: 15px 0;
    }
    input, button {
      padding: 12px;
      border-radius: 8px;
      margin: 5px 0;
    }
    button { cursor: pointer; }
  </style>
</head>
<body>
  <h1>WINGO ANALYZER</h1>
  <p>Historical result statistics dashboard</p>

  <div class="card">
    <h3>Add result</h3>
    <input id="number" type="number" min="0" max="9"
      placeholder="Enter number (0-9)">
    <button onclick="addResult()">Add result</button>
  </div>

  <div class="card">
    <h3>Statistics</h3>
    <p>Total results: <span id="total">0</span></p>
    <p>Big: <span id="big">0</span></p>
    <p>Small: <span id="small">0</span></p>
    <p>Red: <span id="red">0</span></p>
    <p>Green: <span id="green">0</span></p>
    <p>Violet: <span id="violet">0</span></p>
  </div>

  <div class="card">
    <h3>Recent results</h3>
    <div id="history">No results yet</div>
  </div>

  <script>
    const results = [];

    function addResult() {
      const input = document.getElementById("number");
      const n = Number(input.value);

      if (input.value === "" || !Number.isInteger(n) || n < 0 || n > 9) {
        alert("Enter a number from 0 to 9");
        return;
      }

      results.unshift(n);
      input.value = "";

      const count = (arr, fn) => arr.filter(fn).length;
      const red = n => [0, 2, 4, 6, 8].includes(n);
      const green = n => [1, 3, 5, 7, 9].includes(n);

      document.getElementById("total").textContent = results.length;
      document.getElementById("big").textContent =
        count(results, n => n >= 5);
      document.getElementById("small").textContent =
        count(results, n => n <= 4);
      document.getElementById("red").textContent =
        count(results, red);
      document.getElementById("green").textContent =
        count(results, green);
      document.getElementById("violet").textContent =
        count(results, n => n === 0 || n === 5);

      document.getElementById("history").textContent =
        results.join(" • ");
    }
  </script>
</body>
</html>
